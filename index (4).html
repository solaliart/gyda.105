<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyda 105</title>

<style>
:root{--bg:#FAF8F5;--ink:#2F2A3B;--muted:#6F6A7C;--lila:#B9A7D6;--lila-fosc:#6F5A9B;--lila-suau:#EEE8F6;--salvia:#A9B8A0;--linia:#E8E3EE;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);line-height:1.7}
h1,h2,h3{font-weight:300;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:20;background:rgba(250,248,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linia);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 5vw}
.logo{font-size:1.4rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.logo b{font-weight:500;color:var(--lila-fosc)}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:999px;transition:.3s}
nav a:hover,nav a.on{background:var(--lila-suau);color:var(--lila-fosc)}
select,button,input,textarea{font-family:inherit}
.lang{background:transparent;border:1px solid var(--linia);padding:7px 10px;color:var(--ink);border-radius:999px;cursor:pointer;transition:.3s}
.lang:hover{border-color:var(--lila);background:var(--lila-suau)}
.cart-btn{background:var(--lila-suau);border:none;cursor:pointer;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lila-fosc);padding:10px 18px;border-radius:999px;transition:.3s}
.cart-btn:hover{background:var(--lila-fosc);color:#fff}
.hero{text-align:center;padding:16vh 6vw;background:radial-gradient(ellipse at top,var(--lila-suau),var(--bg) 70%)}
.hero h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.1;margin-bottom:22px;font-weight:200}
.hero h1 em{font-style:normal;color:var(--lila-fosc);font-weight:300}
.hero p{max-width:540px;margin:0 auto 34px;color:var(--muted)}
.btn{display:inline-block;background:var(--lila-fosc);color:#fff;border:1px solid var(--lila-fosc);padding:13px 30px;font-size:.72rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.3s;border-radius:999px;text-decoration:none}
.btn:hover{background:var(--lila);border-color:var(--lila);color:var(--ink)}
.btn.alt{background:transparent;color:var(--lila-fosc)}
.btn.alt:hover{background:var(--lila-suau);border-color:var(--lila);color:var(--lila-fosc)}
section{padding:70px 5vw}
.wrap{max-width:1200px;margin:auto}
.narrow{max-width:720px;margin:auto;text-align:center}
.narrow p,.sub{color:var(--muted)}
h2.t{font-size:2.2rem;margin-bottom:12px}
.sub{margin-bottom:30px}
.page-head{text-align:center;padding:70px 5vw 10px;background:linear-gradient(180deg,var(--lila-suau),var(--bg))}
.page-head h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:200}
.page-head p{color:var(--muted);max-width:600px;margin:10px auto 0}
.back{background:none;border:none;color:var(--lila-fosc);cursor:pointer;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px;padding:8px 14px;border-radius:999px;transition:.3s}
.back:hover{background:var(--lila-suau)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.tile{position:relative;min-height:220px;border-radius:24px;padding:28px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:none;text-align:left;overflow:hidden;transition:.35s}
.tile:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(111,90,155,.22)}
.tile .n{position:absolute;top:20px;right:26px;font-size:3.4rem;font-weight:200;opacity:.35}
.tile h3{font-size:1.7rem;font-weight:300;color:#fff}
.tile p{font-size:.88rem;opacity:.92}
.tile .go{margin-top:12px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:34px}
.val{background:#fff;border:1px solid var(--linia);border-radius:var(--r);padding:26px;text-align:center}
.val h3{font-size:1.15rem;font-weight:400;color:var(--lila-fosc);margin-bottom:6px}
.val p{font-size:.88rem;color:var(--muted)}
.band{background:var(--lila-suau);border-radius:28px;padding:50px 30px;text-align:center}
/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.card{background:#fff;border:1px solid var(--linia);padding:16px;display:flex;flex-direction:column;gap:10px;transition:.3s;border-radius:var(--r)}
.card:hover{box-shadow:0 14px 36px rgba(111,90,155,.12);transform:translateY(-3px)}
.ph{height:170px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:200;color:#fff;border-radius:12px}
.card h3{font-size:1.2rem;font-weight:400;padding:0 4px}
.card .desc{font-size:.85rem;color:var(--muted);flex:1;padding:0 4px}
.price{color:var(--lila-fosc);font-size:1.1rem;font-weight:400;padding:0 4px}
.card select{padding:10px 12px;border:1px solid var(--linia);background:var(--bg);color:var(--ink);border-radius:12px;cursor:pointer;transition:.3s}
.card select:hover:not(:disabled){border-color:var(--lila)}
.row{display:flex;gap:8px}
.row .btn{flex:1;padding:12px 6px;font-size:.66rem}
.soon{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lila-fosc);background:var(--lila-suau);padding:6px 14px;border-radius:999px;align-self:flex-start;margin:0 4px}
/* donate / contact */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;align-items:start}
.box{background:#fff;border:1px solid var(--linia);border-radius:24px;padding:32px}
.box h2{font-size:1.7rem;margin-bottom:8px}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 14px}
.amt{padding:14px 0;border:1px solid var(--linia);background:var(--bg);border-radius:14px;cursor:pointer;font-size:1rem;color:var(--ink);transition:.3s}
.amt:hover{border-color:var(--lila);background:var(--lila-suau)}
.amt.on{background:var(--lila-fosc);border-color:var(--lila-fosc);color:#fff}
input,textarea{width:100%;padding:13px 16px;border:1px solid var(--linia);background:var(--bg);border-radius:14px;color:var(--ink);font-weight:300;font-size:.95rem;margin-bottom:12px;transition:.3s}
input:hover,textarea:hover,input:focus,textarea:focus{border-color:var(--lila);outline:none}
textarea{min-height:140px;resize:vertical}
.box .btn{width:100%}
.info p{margin-bottom:14px;color:var(--muted)}
.info strong{color:var(--ink);font-weight:500;display:block}
.msg{margin-top:12px;color:var(--lila-fosc);font-size:.9rem}
/* cart */
#overlay{position:fixed;inset:0;background:rgba(47,42,59,.3);opacity:0;pointer-events:none;transition:.3s;z-index:30}
#overlay.on{opacity:1;pointer-events:auto}
#cart{position:fixed;top:0;right:-440px;width:min(420px,100%);height:100%;background:var(--bg);z-index:40;transition:.4s;display:flex;flex-direction:column;padding:26px;border-radius:24px 0 0 24px;box-shadow:-10px 0 40px rgba(47,42,59,.1)}
#cart.on{right:0}
#cart h2{margin-bottom:14px}
#items{flex:1;overflow:auto}
.item{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--linia);font-size:.9rem}
.qty{display:flex;align-items:center;gap:8px;height:fit-content}
.qty button{width:28px;height:28px;border:1px solid var(--linia);background:#fff;cursor:pointer;border-radius:50%;transition:.3s}
.qty button:hover{background:var(--lila);border-color:var(--lila);color:#fff}
.rm{background:none;border:none;color:var(--lila-fosc);cursor:pointer;font-size:.75rem;text-decoration:underline;transition:.3s}
.rm:hover{color:var(--lila)}
.total{display:flex;justify-content:space-between;font-size:1.2rem;padding:18px 0}
footer{text-align:center;padding:50px 5vw;border-top:1px solid var(--linia);font-size:.8rem;color:var(--muted)}
footer a{color:var(--lila-fosc);text-decoration:none}
</style>
</head>

  sub:{ca:"Seleccions pensades per regalar o regalar-te.",es:"Selecciones pensadas para regalar o regalarte.",en:"Curated sets to gift or treat yourself."},
  items:[
   {id:"pack-relax",n:{ca:"Pack Relax",es:"Pack Relax",en:"Relax Pack"},d:{ca:"Aigua de lavanda, roll-on Serenitat i sabó.",es:"Agua de lavanda, roll-on Serenidad y jabón.",en:"Lavender water, Serenity roll-on and soap."},opts:[{l:"Pack",p:3500}]}
  ]}
];

/* ============ ESTAT ============ */
let lang = localStorage.getItem("lang") || "ca";
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let donation = 2500;
const eur = c => (c/100).toFixed(2).replace(".",",")+" €";
const $ = id => document.getElementById(id);

/* ============ PÀGINES ============ */
function tiles(){
  return `<div class="tiles">${CATS.map((c,i)=>`
    <button class="tile" style="background:linear-gradient(145deg,${c.color},${shade(c.color)})" onclick="location.hash='#/coleccio/${c.id}'">
      <span class="n">0${i+1}</span>
      <h3>${c.name[lang]}</h3>
      <p>${c.sub[lang]}</p>
      <span class="go">${T[lang].explore} →</span>
    </button>`).join("")}</div>`;
}
function shade(h){const n=parseInt(h.slice(1),16);const f=.82;return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*f).toString(16).padStart(2,"0")).join("")}

function pageHome(){
  const t=T[lang];
  return `
  <div class="hero"><h1>${t.hero_t}</h1><p>${t.hero_p}</p><a href="#/coleccio" class="btn">${t.hero_b}</a></div>
  <section><div class="narrow"><h2 class="t">${t.about_t}</h2><p>${t.about_p}</p></div>
    <div class="wrap"><div class="values">
      <div class="val"><h3>${t.v1}</h3><p>${t.v1p}</p></div>
      <div class="val"><h3>${t.v2}</h3><p>${t.v2p}</p></div>
      <div class="val"><h3>${t.v3}</h3><p>${t.v3p}</p></div>
    </div></div></section>
  <section class="wrap"><h2 class="t" style="text-align:center">${t.home_cols}</h2><br>${tiles()}</section>
  <section class="wrap"><div class="band"><h2 class="t">${t.home_proj_t}</h2><p class="sub" style="max-width:520px;margin:0 auto 24px">${t.home_proj_p}</p><a href="#/projecte" class="btn">${t.home_proj_b}</a></div></section>`;
}

function pageCollection(){
  const t=T[lang];
  return `<div class="page-head"><h1>${t.col_t}</h1><p>${t.col_p}</p></div><section class="wrap">${tiles()}</section>`;
}

function pageCategory(id){
  const c=CATS.find(x=>x.id===id); if(!c) return pageCollection();
  const t=T[lang];
  return `<div class="page-head"><h1>${c.name[lang]}</h1><p>${c.sub[lang]}</p></div>
  <section class="wrap"><button class="back" onclick="location.hash='#/coleccio'">${t.back}</button>
  <div class="grid">${c.items.map(it=>`
    <div class="card">
      <div class="ph" style="background:${c.color}">${it.n[lang][0]}</div>
      <h3>${it.n[lang]}</h3>
      <p class="desc">${it.d[lang]}</p>
      ${it.soon?`<span class="soon">${t.soon}</span>`:`
      <select id="o-${it.id}" onchange="upd('${it.id}')" ${it.opts.length<2?'disabled':''}>
        ${it.opts.map((o,i)=>`<option value="${i}">${o.l}</option>`).join("")}
      </select>
      <div class="price" id="p-${it.id}">${eur(it.opts[0].p)}</div>
      <div class="row">
        <button class="btn alt" onclick="add('${it.id}')">${t.add}</button>
        <button class="btn" onclick="buyNow('${it.id}')">${t.buy}</button>
      </div>`}
    </div>`).join("")}</div></section>`;
}

function pageProject(){
  const t=T[lang];
  const amts=[1000,2500,5000,10000];
  return `<div class="page-head"><h1>${t.proj_t}</h1><p>${t.proj_p}</p></div>
  <section class="wrap"><div class="two">
    <div class="box"><h2>${t.proj_h}</h2><p style="color:var(--muted)">${t.proj_txt}</p></div>
    <div class="box"><h2>${t.don_t}</h2><p style="color:var(--muted)">${t.don_p}</p>
      <div class="amounts">${amts.map(a=>`<button class="amt ${a===donation?'on':''}" onclick="pick(${a})">${a/100} €</button>`).join("")}</div>
      <input id="don-other" type="number" min="1" step="1" placeholder="${t.other}" oninput="pickCustom(this.value)">
      <button class="btn" onclick="donate()">${t.don_b}</button>
      <p class="msg" id="don-msg"></p>
    </div></div></section>`;
}
function pick(a){donation=a;$("don-other").value="";document.querySelectorAll(".amt").forEach(b=>b.classList.toggle("on",b.textContent.trim()===(a/100)+" €"))}
function pickCustom(v){donation=Math.round(parseFloat(v||0)*100);document.querySelectorAll(".amt").forEach(b=>b.classList.remove("on"))}
async function donate(){
  if(!(donation>=100)){$("don-msg").textContent=T[lang].don_err;return}
  try{
    const r=await fetch(DONATION_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang,amount:donation})});
    const d=await r.json(); if(d.url)window.location=d.url; else throw 0;
  }catch(e){$("don-msg").textContent=T[lang].err}
}

function pageContact(){
  const t=T[lang];
  return `<div class="page-head"><h1>${t.con_t}</h1><p>${t.con_p}</p></div>
  <section class="wrap"><div class="two">
    <form class="box" onsubmit="sendContact(event)">
      <input id="c-name" required placeholder="${t.name}">
      <input id="c-email" type="email" required placeholder="${t.email}">
      <textarea id="c-msg" required placeholder="${t.message}"></textarea>
      <button class="btn" type="submit">${t.send}</button>
      <p class="msg" id="c-status"></p>
    </form>
    <div class="box info"><p><strong>${t.mail}</strong>${CONTACT_EMAIL}</p><p><strong>${t.phone}</strong>${PHONE}</p><p><strong>${t.place}</strong>${LOCATION}</p></div>
  </div></section>`;
}
async function sendContact(e){
  e.preventDefault();
  const name=$("c-name").value,email=$("c-email").value,message=$("c-msg").value;
  if(!CONTACT_ENDPOINT){
    location.href=`mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent("Gyda 105 - "+name)}&body=${encodeURIComponent(message+"\n\n"+email)}`;return;
  }
  try{
    const r=await fetch(CONTACT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({name,email,message})});
    if(!r.ok)throw 0; $("c-status").textContent=T[lang].sent; e.target.reset();
  }catch(_){$("c-status").textContent=T[lang].con_err}
}

/* ============ ROUTER ============ */
function route(){
  const h=(location.hash||"#/").replace("#/","").split("/");
  const p=h[0]||"home";
  let html;
  if(p==="coleccio") html=h[1]?pageCategory(h[1]):pageCollection();
  else if(p==="projecte") html=pageProject();
  else if(p==="contacte") html=pageContact();
  else html=pageHome();
  $("app").innerHTML=html;
  document.querySelectorAll("nav a[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===(p==="home"?"home":p)));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ============ PRODUCTE I CARRETÓ ============ */
function find(id){for(const c of CATS)for(const i of c.items)if(i.id===id)return i}
function upd(id){const it=find(id);const i=$("o-"+id).value;$("p-"+id).textContent=eur(it.opts[i].p)}
function save(){localStorage.setItem("cart",JSON.stringify(cart));renderCart()}
function add(id,open=true){
  const it=find(id),i=+$("o-"+id).value,o=it.opts[i],key=id+"|"+o.l;
  const ex=cart.find(x=>x.key===key);
  if(ex)ex.q++;else cart.push({key,id,opt:o.l,price:o.p,q:1});
  save();if(open)toggleCart(true);
}
function buyNow(id){add(id,false);checkout()}
function chg(key,d){const x=cart.find(x=>x.key===key);x.q+=d;if(x.q<=0)cart=cart.filter(y=>y.key!==key);save()}
function del(key){cart=cart.filter(y=>y.key!==key);save()}
function renderCart(){
  $("items").innerHTML = cart.length ? cart.map(x=>{const it=find(x.id);return `
    <div class="item"><div><strong>${it.n[lang]}</strong><br><small>${x.opt} · ${eur(x.price)}</small><br>
      <button class="rm" onclick="del('${x.key}')">${T[lang].remove}</button></div>
      <div class="qty"><button onclick="chg('${x.key}',-1)">−</button> ${x.q} <button onclick="chg('${x.key}',1)">+</button></div>
    </div>`}).join("") : `<p>${T[lang].empty}</p>`;
  $("count").textContent=cart.reduce((a,x)=>a+x.q,0);
  $("total").textContent=eur(cart.reduce((a,x)=>a+x.q*x.price,0));
}
function toggleCart(on){$("cart").classList.toggle("on",on);$("overlay").classList.toggle("on",on)}

async function checkout(){
  if(!cart.length)return;
  try{
    const r=await fetch(CHECKOUT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({lang,items:cart.map(x=>({id:x.id,option:x.opt,quantity:x.q}))})});
    const data=await r.json();
    if(data.url)window.location=data.url; else throw 0;
  }catch(e){alert(T[lang].err)}
}

/* ============ IDIOMA ============ */
function setLang(l){
  lang=l;localStorage.setItem("lang",l);document.documentElement.lang=l;$("lang").value=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=T[l][e.dataset.i]});
  route();renderCart();
}
setLang(lang);
</script>
</body>
</html>

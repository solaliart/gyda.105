<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyda 105</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F5;--ink:#2F2A3B;--muted:#6F6A7C;--lila:#B9A7D6;--lf:#6F5A9B;--ls:#EEE8F6;--linia:#E8E3EE;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);line-height:1.7}
h1,h2,h3{font-weight:300;letter-spacing:-.01em}
select,button,input,textarea{font-family:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(250,248,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linia);display:flex;justify-content:space-between;align-items:center;padding:14px 5vw}
.logo{font-size:1.4rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.logo b{font-weight:500;color:var(--lf)}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:999px;transition:.3s}
nav a:hover,nav a.on{background:var(--ls);color:var(--lf)}
.lang{background:transparent;border:1px solid var(--linia);padding:7px 10px;color:var(--ink);border-radius:999px;cursor:pointer}
.cart-btn{background:var(--ls);border:none;cursor:pointer;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lf);padding:10px 18px;border-radius:999px;transition:.3s}
.cart-btn:hover{background:var(--lf);color:#fff}
.hero{text-align:center;padding:12vh 6vw 8vh;background:radial-gradient(ellipse at top,var(--ls),var(--bg) 70%)}
.hero h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.1;margin-bottom:22px;font-weight:200}
.hero h1 em{font-style:normal;color:var(--lf)}
.hero p{max-width:540px;margin:0 auto 34px;color:var(--muted)}
.btn{display:inline-block;background:var(--lf);color:#fff;border:1px solid var(--lf);padding:13px 30px;font-size:.72rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;border-radius:999px;transition:.3s}
.btn:hover{background:var(--lila);border-color:var(--lila);color:var(--ink)}
.btn.alt{background:transparent;color:var(--lf)}
.btn.alt:hover{background:var(--ls)}
section{padding:70px 5vw}
.wrap{max-width:1200px;margin:auto}
.narrow{max-width:720px;margin:auto;text-align:center}
.narrow p,.sub{color:var(--muted)}
h2.t{font-size:2.2rem;margin-bottom:12px;text-align:center}
.sub{margin-bottom:30px;text-align:center}
.page-head{text-align:center;padding:70px 5vw 10px;background:linear-gradient(180deg,var(--ls),var(--bg))}
.page-head h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:200}
.page-head p{color:var(--muted);max-width:600px;margin:10px auto 0}
.back{background:none;border:none;color:var(--lf);cursor:pointer;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px;padding:8px 14px;border-radius:999px;transition:.3s}
.back:hover{background:var(--ls)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.tile{position:relative;min-height:220px;border-radius:24px;padding:28px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;overflow:hidden;transition:.35s}
.tile:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(111,90,155,.22)}
.tile .n{position:absolute;top:20px;right:26px;font-size:3.4rem;font-weight:200;opacity:.35}
.tile h3{font-size:1.7rem;color:#fff}
.tile p{font-size:.88rem;opacity:.95}
.tile .go{margin-top:12px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:34px}
.val{background:#fff;border:1px solid var(--linia);border-radius:var(--r);padding:26px;text-align:center}
.val h3{font-size:1.15rem;font-weight:400;color:var(--lf);margin-bottom:6px}
.val p{font-size:.88rem;color:var(--muted)}
.band{background:var(--ls);border-radius:28px;padding:50px 30px;text-align:center}
.band p{max-width:560px;margin:0 auto 24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px;align-items:start}
.card{background:#fff;border:1px solid var(--linia);padding:16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s;border-radius:var(--r)}
.card:hover{box-shadow:0 14px 36px rgba(111,90,155,.12)}
.card h3{font-size:1.2rem;font-weight:400;padding:0 4px}
.card .desc{font-size:.85rem;color:var(--muted);padding:0 4px}
.price{color:var(--lf);font-size:1.1rem;font-weight:400;padding:0 4px;min-height:1.7em;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}
.price.show{opacity:1;visibility:visible}
.card select{padding:10px 12px;border:1px solid var(--linia);background:var(--bg);color:var(--ink);border-radius:12px;cursor:pointer}
.row{display:flex;gap:8px}
.row .btn{flex:1;padding:12px 6px;font-size:.66rem}
.soon{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lf);background:var(--ls);padding:6px 14px;border-radius:999px;align-self:flex-start;margin:0 4px}
.titrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plus{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--lila);background:var(--ls);color:var(--lf);font-size:1.3rem;line-height:1;cursor:pointer;transition:.3s}
.plus:hover{background:var(--lf);color:#fff}
.more{font-size:.85rem;color:var(--muted);padding:12px 6px 4px;border-top:1px solid var(--linia)}
.more[hidden]{display:none}
.more p{margin-bottom:10px}
.more ul{margin:0 0 10px 18px}
.more b{color:var(--ink);font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;align-items:start}
.box{background:#fff;border:1px solid var(--linia);border-radius:24px;padding:32px}
.box h2{font-size:1.7rem;margin-bottom:8px}
.box p{color:var(--muted)}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 14px}
.amt{padding:14px 0;border:1px solid var(--linia);background:var(--bg);border-radius:14px;cursor:pointer;font-size:1rem;color:var(--ink);transition:.3s}
.amt:hover{border-color:var(--lila);background:var(--ls)}
.amt.on{background:var(--lf);border-color:var(--lf);color:#fff}
input,textarea{width:100%;padding:13px 16px;border:1px solid var(--linia);background:var(--bg);border-radius:14px;color:var(--ink);font-weight:300;font-size:.95rem;margin-bottom:12px;transition:.3s}
input:focus,textarea:focus{border-color:var(--lila);outline:none}
textarea{min-height:140px;resize:vertical}
.box .btn{width:100%}
.info p{margin-bottom:14px}
.info strong{color:var(--ink);font-weight:500;display:block}
.msg{margin-top:12px;color:var(--lf);font-size:.9rem}
#overlay{position:fixed;inset:0;background:rgba(47,42,59,.3);opacity:0;pointer-events:none;transition:.3s;z-index:30}
#overlay.on{opacity:1;pointer-events:auto}
#cart{position:fixed;top:0;right:-440px;width:min(420px,100%);height:100%;background:var(--bg);z-index:40;transition:.4s;display:flex;flex-direction:column;padding:26px;border-radius:24px 0 0 24px}
#cart.on{right:0}
#cart h2{margin-bottom:14px}
#items{flex:1;overflow:auto}
.item{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--linia);font-size:.9rem}
.qty{display:flex;align-items:center;gap:8px;height:fit-content}
.qty button{width:28px;height:28px;border:1px solid var(--linia);background:#fff;cursor:pointer;border-radius:50%}
.qty button:hover{background:var(--lila);color:#fff}
.rm{background:none;border:none;color:var(--lf);cursor:pointer;font-size:.75rem;text-decoration:underline}
.total{display:flex;justify-content:space-between;font-size:1.2rem;padding:18px 0}
footer{text-align:center;padding:50px 5vw;border-top:1px solid var(--linia);font-size:.8rem;color:var(--muted)}
.hero-img{display:block;width:100%;max-width:760px;height:auto;max-height:480px;object-fit:cover;border-radius:28px;margin:44px auto 0}
.gal{position:relative;overflow:hidden}
.gal .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:100%;scroll-snap-align:center;background:linear-gradient(135deg,var(--ls),#D9CEEB)}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.gal.cg{height:200px;border-radius:12px}
.gal.strip{height:clamp(150px,26vw,280px);border-radius:24px;margin-top:44px}
.gb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.88);color:var(--lf);cursor:pointer;font-size:1.2rem;line-height:1;display:grid;place-items:center}
.gb:hover{background:#fff}
.gb.l{left:10px}.gb.r{right:10px}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:30px}
.pp .sl{height:220px;border-radius:var(--r);overflow:hidden}
.cat-desc{max-width:760px;margin:0 auto 34px;text-align:left;color:var(--muted)}
.cat-desc p{margin-bottom:12px}
</style>
</head>

/* ===== ESTAT ===== */
let lang=localStorage.getItem("g105lang")||"ca";
if(!T[lang])lang="ca";
let cart=[];
try{cart=JSON.parse(localStorage.getItem("g105cart")||"[]")}catch(e){cart=[]}
let donAmt=2000;

const $=s=>document.querySelector(s);
const t=k=>T[lang][k]||k;
const fmt=c=>(c/100).toFixed(2).replace(".",",")+" €";
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ===== GALERIES ===== */
function gal(cls,names,alt){
  const sl=names.map(n=>'<div class="sl"><img src="'+IMG_DIR+n+'.jpg" alt="'+esc(alt)+'" loading="lazy" onerror="this.style.display=\'none\'"></div>').join("");
  return '<div class="gal '+cls+'"><div class="track">'+sl+'</div>'+
  '<button class="gb l" aria-label="'+ALT[lang].prev+'" onclick="slide(this,-1)">‹</button>'+
  '<button class="gb r" aria-label="'+ALT[lang].next+'" onclick="slide(this,1)">›</button></div>';
}
function slide(b,d){const tr=b.parentNode.querySelector(".track");tr.scrollBy({left:d*tr.clientWidth,behavior:"smooth"})}

/* ===== PÀGINES ===== */
function tilesHTML(){
  return '<div class="tiles">'+CATS.map((c,i)=>{
   const n=c.items.length;
   return '<a class="tile" href="#/cat/'+c.id+'" style="background:'+c.color+'"><span class="n">0'+(i+1)+'</span><h3>'+c.name[lang]+'</h3><p>'+c.sub[lang]+'</p><div class="go">'+t("explore")+' · '+n+' '+t("products")+'</div></a>';
  }).join("")+'</div>';
}
function pHome(){
  return '<div class="hero"><h1>'+t("hero_t")+'</h1><p>'+t("hero_p")+'</p><a class="btn" href="#/coleccio">'+t("hero_b")+'</a>'+
  '<img class="hero-img" src="'+IMG_DIR+'inici.jpg" alt="'+esc(ALT[lang].hero)+'" onerror="this.style.display=\'none\'"></div>'+
  '<section><div class="wrap"><div class="narrow"><h2 class="t">'+t("about_t")+'</h2><p>'+t("about_p")+'</p></div>'+
  gal("strip",["sobre-1","sobre-2","sobre-3"],ALT[lang].about)+
  '<div class="values"><div class="val"><h3>'+t("v1")+'</h3><p>'+t("v1p")+'</p></div><div class="val"><h3>'+t("v2")+'</h3><p>'+t("v2p")+'</p></div><div class="val"><h3>'+t("v3")+'</h3><p>'+t("v3p")+'</p></div></div></div></section>'+
  '<section><div class="wrap"><h2 class="t">'+t("home_t")+'</h2><p class="sub">'+t("home_cols")+'</p>'+tilesHTML()+'</div></section>'+
  '<section><div class="wrap"><div class="band"><h2 class="t">'+t("home_proj_t")+'</h2><p>'+t("home_proj_p")+'</p><a class="btn" href="#/projecte">'+t("home_proj_b")+'</a></div></div></section>';
}
function pCol(){
  return '<div class="page-head"><h1>'+t("col_t")+'</h1><p>'+t("col_p")+'</p></div><section><div class="wrap">'+tilesHTML()+'</div></section>';
}
function card(c,ci,it,ii){
  const opts='<option value="">'+t("size")+'</option>'+it.opts.map((o,k)=>'<option value="'+k+'">'+o.l+'</option>').join("");
  const plus=it.long?'<button class="plus" aria-label="'+esc(t("more"))+'" title="'+esc(t("more"))+'" onclick="tg(this)">+</button>':'';
  const more=it.long?'<div class="more" hidden>'+it.long[lang]+'</div>':'';
  return '<div class="card" data-c="'+ci+'" data-i="'+ii+'">'+gal("cg",[it.id+"-1",it.id+"-2",it.id+"-3"],it.n[lang])+ 
  '<div class="titrow"><h3>'+it.n[lang]+'</h3>'+plus+'</div><div class="desc">'+it.d[lang]+'</div>'+more+
  '<select onchange="pick(this)">'+opts+'</select><div class="price"></div>'+
  '<div class="row"><button class="btn alt" onclick="add(this,false)">'+t("add")+'</button><button class="btn" onclick="add(this,true)">'+t("buy")+'</button></div></div>';
}
function pCat(id){
  const ci=CATS.findIndex(c=>c.id===id);
  if(ci<0)return pCol();
  const c=CATS[ci];
  const desc=c.desc[lang].filter(x=>x).map(x=>"<p>"+x+"</p>").join("");
  return '<div class="page-head"><h1>'+c.name[lang]+'</h1><p>'+c.sub[lang]+'</p></div><section><div class="wrap"><button class="back" onclick="location.hash=\'#/coleccio\'">'+t("back")+'</button>'+
  (desc?'<div class="cat-desc">'+desc+'</div>':'')+
  '<div class="grid">'+c.items.map((it,ii)=>card(c,ci,it,ii)).join("")+'</div></div></section>';
}
function pProj(){
  return '<div class="page-head"><h1>'+t("proj_t")+'</h1><p>'+t("proj_p")+'</p></div><section><div class="wrap">'+
  '<div class="pp">'+[1,2,3,4].map(n=>'<div class="sl"><img src="'+IMG_DIR+'projecte-'+n+'.jpg" alt="'+esc(ALT[lang].proj)+'" loading="lazy" onerror="this.style.display=\'none\'"></div>').join("")+'</div>'+
  '<div class="two"><div class="box"><h2>'+t("proj_h")+'</h2><p>'+t("proj_txt")+'</p></div>'+
  '<div class="box"><h2>'+t("don_t")+'</h2><p>'+t("don_p")+'</p><div class="amounts">'+[1000,2000,5000,10000].map(a=>'<button class="amt'+(a===donAmt?' on':'')+'" onclick="setAmt('+a+')">'+(a/100)+' €</button>').join("")+'</div><input id="don-other" type="number" min="1" step="1" placeholder="'+esc(t("other"))+'" oninput="otherAmt(this.value)"><button class="btn" onclick="donate()">'+t("don_b")+'</button><div class="msg" id="don-msg"></div></div></div></div></section>';
}
function pCon(){
  return '<div class="page-head"><h1>'+t("con_t")+'</h1><p>'+t("con_p")+'</p></div><section><div class="wrap"><div class="two">'+
  '<div class="box"><form onsubmit="return sendMsg(event)"><input id="c-name" placeholder="'+esc(t("name"))+'" required><input id="c-mail" type="email" placeholder="'+esc(t("email"))+'" required><textarea id="c-msg" placeholder="'+esc(t("message"))+'" required></textarea><button class="btn" type="submit">'+t("send")+'</button><div class="msg" id="c-res"></div></form></div>'+
  '<div class="box info"><p><strong>'+t("mail")+'</strong>'+CONTACT_EMAIL+'</p><p><strong>'+t("phone")+'</strong>'+PHONE+'</p><p><strong>'+t("place")+'</strong>'+LOCATION+'</p></div></div></div></section>';
}

/* ===== ROUTER ===== */
function render(){
  const h=location.hash.replace(/^#\/?,"" );
  const parts=h.split("/");
  let r=parts[0]||"home",html;
  if(r==="coleccio")html=pCol();
  else if(r==="cat")html=pCat(parts[1]);
  else if(r==="projecte")html=pProj();
  else if(r==="contacte")html=pCon();
  else{r="home";html=pHome()}
  $("#app").innerHTML=html;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(r==="cat"?"coleccio":r)));
  window.scrollTo(0,0);
  i18n();
}
function i18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("#lang").value=lang;
  drawCart();
}
function setLang(l){lang=l;localStorage.setItem("g105lang",l);const y=window.scrollY;render();window.scrollTo(0,y)}
window.addEventListener("hashchange",render);

/* ===== PRODUCTES ===== */
function tg(b){const m=b.closest(".card").querySelector(".more");m.hidden=!m.hidden;b.textContent=m.hidden?"+":"−"}
function getItem(card){return CATS[card.dataset.c].items[card.dataset.i]}
function pick(sel){
  const card=sel.closest(".card"),it=getItem(card),pr=card.querySelector(".price");
  sel.style.borderColor="";
  if(sel.value===""){
    pr.textContent="";
    pr.classList.remove("show");
    return;
  }
  pr.textContent=fmt(it.opts[sel.value].p);
  pr.classList.add("show");
}
function add(btn,buyNow){
  const card=btn.closest(".card"),sel=card.querySelector("select");
  if(sel.value===""){sel.style.borderColor="#c0392b";sel.focus();return}
  const it=getItem(card),o=it.opts[sel.value],key=it.id+"|"+o.l;
  const ex=cart.find(x=>x.k===key);
  if(ex)ex.q++;else cart.push({k:key,id:it.id,n:it.n[lang],l:o.l,p:o.p,q:1});
  saveCart();
  if(buyNow)checkout();else toggleCart(true);
}

/* ===== CARRETÓ ===== */
function saveCart(){localStorage.setItem("g105cart",JSON.stringify(cart));drawCart()}
function toggleCart(on){$("#cart").classList.toggle("on",on);$("#overlay").classList.toggle("on",on)}
function chg(k,d){const x=cart.find(i=>i.k===k);if(!x)return;x.q+=d;if(x.q<=0)cart=cart.filter(i=>i.k!==k);saveCart()}
function rem(k){cart=cart.filter(i=>i.k!==k);saveCart()}
function drawCart(){
  $("#count").textContent=cart.reduce((s,i)=>s+i.q,0);
  $("#total").textContent=fmt(cart.reduce((s,i)=>s+i.p*i.q,0));
  $("#items").innerHTML=cart.length?cart.map(i=>
   '<div class="item"><div><strong>'+esc(i.n)+'</strong><br><small>'+i.l+' · '+fmt(i.p)+'</small><br><button class="rm" onclick="rem(\''+i.k+'\')">'+t("remove")+'</button></div>'+
   '<div class="qty"><button onclick="chg(\''+i.k+'\',-1)">−</button><span>'+i.q+'</span><button onclick="chg(\''+i.k+'\',1)">+</button></div></div>').join(""): '<p style="color:var(--muted)">'+t("empty")+'</p>';
}
async function checkout(){
  if(!cart.length)return;
  try{
   const r=await fetch(CHECKOUT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:cart.map(i=>({id:i.id,size:i.l,qty:i.q})),lang})});
   const d=await r.json();
   if(d.url)location.href=d.url;else throw 0;
  }catch(e){alert(t("err"))}
}

/* ===== DONACIONS I CONTACTE ===== */
function setAmt(a){donAmt=a;const o=$("#don-other");if(o)o.value="";document.querySelectorAll(".amt").forEach(b=>b.classList.toggle("on",b.textContent.trim()===(a/100)+" €"))}
function otherAmt(v){const n=Math.round(parseFloat(v)*100);if(n>0){donAmt=n;document.querySelectorAll(".amt").forEach(b=>b.classList.remove("on"))}}
async function donate(){
  const m=$("#don-msg");m.textContent="";
  if(!donAmt||donAmt<100){m.textContent=t("don_err");return}
  try{
   const r=await fetch(DONATION_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:donAmt,lang})});
   const d=await r.json();
   if(d.url)location.href=d.url;else throw 0;
  }catch(e){m.textContent=t("err")}
}
async function sendMsg(e){
  e.preventDefault();
  const n=$("#c-name").value,m=$("#c-mail").value,x=$("#c-msg").value,res=$("#c-res");
  if(!CONTACT_ENDPOINT){location.href="mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent("Gyda 105 - "+n)+"&body="+encodeURIComponent(x+"\n\n"+n+" ("+m+")");return false}
  try{
   const r=await fetch(CONTACT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,email:m,message:x})});
   if(!r.ok)throw 0;
   res.textContent=t("sent");e.target.reset();
  }catch(err){res.textContent=t("con_err")}
  return false;
}

render();
